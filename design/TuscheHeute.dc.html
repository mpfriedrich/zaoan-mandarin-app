<!doctype html>
<html>

</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f2ea; color: #1d1b18; display: flex; flex-direction: column; padding: 64px 24px 0 24px; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #6f685e;">Sonntag, 13. September</span>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">早安</span>
        <span class="serif" style="font-size: 18px; font-style: italic; color: #6f685e;">zǎo'ān</span>
      </div>
    </div>
    <div style="width: 60px; height: 60px; border: 2px solid oklch(0.56 0.18 32); border-radius: 6px; color: oklch(0.56 0.18 32); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-4deg); flex-shrink: 0;">
      <span class="serif" style="font-size: 26px; font-weight: 600; line-height: 1;">5</span>
      <span style="font-size: 10px; letter-spacing: 1px; text-transform: uppercase;">Tage</span>

  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px;">

      <span style="color: #6f685e;">Tagesziel</span>

    </div>
    <div style="height: 4px; background: #ddd4c5;">
      <div style="width: 40%; height: 100%; background: #1d1b18;"></div>
    </div>
  </div>

  <div class="serif" style="margin-top: 36px; font-size: 26px; font-weight: 600;">Heute</div>

  <div style="margin-top: 10px; display: flex; flex-direction: column; border-top: 1px solid #1d1b18;">
    <div style="display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid #ddd4c5; min-height: 44px;">
      <span class="serif" style="font-size: 15px; color: #6f685e; width: 18px;">1</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 700;">12 Wiederholungen</span>
        <span style="font-size: 14px; color: #6f685e;">ca. 4 Minuten · zuerst dran</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1b18" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid #ddd4c5; min-height: 44px;">
      <span class="serif" style="font-size: 15px; color: #6f685e; width: 18px;">2</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 17px; font-weight: 700;">Im 7-Eleven</span>
          <span class="zh" style="font-size: 16px; color: #6f685e;">超商</span>
        </div>
        <span style="font-size: 14px; color: #6f685e;">3 neue Sätze · 5 von 8 gelernt</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1b18" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid #ddd4c5; min-height: 44px;">
      <span class="serif" style="font-size: 15px; color: #6f685e; width: 18px;">3</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 700;">Rollenspiel: Batterien kaufen</span>
        <span style="font-size: 14px; color: #6f685e;">Du sprichst mit der Kassiererin</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1b18" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="margin-top: 28px; min-height: 56px; background: #1d1b18; color: #f6f2ea; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; border-radius: 4px;">Mit Wiederholungen starten</div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #ddd4c5; padding: 10px 0 30px 0; margin: 0 -24px; background: #f6f2ea;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #1d1b18;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 11px; font-weight: 700;">Heute</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #8d857a;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
      <span style="font-size: 11px;">Szenarien</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #8d857a;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      <span style="font-size: 11px;">Rollenspiel</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #8d857a;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 11px;">Mehr</span>
    </div>
  </div>
</div>
</x-dc>
