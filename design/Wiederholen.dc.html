<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #007AFF; } a:hover { color: #0062CC; }
    .zh { font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; color: #000000; display: flex; flex-direction: column; padding: 54px 16px 34px 16px; overflow: hidden;">

  <div style="display: flex; align-items: center; min-height: 44px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center;">
      <div style="width: 30px; height: 30px; border-radius: 999px; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(60,60,67,0.6)" stroke-width="3.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;">
      <span style="font-size: 17px; font-weight: 600;">Wiederholen</span>
      <span style="font-size: 13px; color: rgba(60,60,67,0.6);">3 von 12</span>
    </div>
    <div style="width: 44px;"></div>
  </div>

  <div style="margin-top: 10px; height: 4px; border-radius: 999px; background: rgba(120,120,128,0.2); overflow: hidden;">
    <div style="width: 25%; height: 100%; border-radius: 999px; background: #007AFF;"></div>
  </div>

  <div style="margin-top: 18px; background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(0,122,255,0.12); color: #007AFF; font-size: 13px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="5" height="7" rx="2"></rect><rect x="16" y="14" width="5" height="7" rx="2"></rect></svg>
        Hören
      </div>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 13px; color: rgba(60,60,67,0.6);">aus: Im 7-Eleven</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0;">
      <div style="width: 64px; height: 64px; border-radius: 999px; background: #007AFF; display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M3 9h4l5-4v14l-5-4H3z"></path><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
      </div>
      <span style="font-size: 15px; color: rgba(60,60,67,0.6);">Nochmal anhören</span>
    </div>

    <div style="height: 0.5px; background: rgba(60,60,67,0.29);"></div>

    <div style="display: flex; gap: 4px; align-items: flex-end; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 48px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">bú</span>
        <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">不</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 48px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">yòng</span>
        <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">用</span>
      </div>
      <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">，</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 48px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">xiè</span>
        <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">謝</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 48px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">xie</span>
        <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">謝</span>
      </div>
      <span class="zh" style="font-size: 40px; font-weight: 600; line-height: 1.15;">。</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <span style="font-size: 20px; font-weight: 600;">„Nein, danke.“</span>
      <span style="font-size: 15px; color: rgba(60,60,67,0.6);">Vereinfacht: <span class="zh" style="color: #000000;">不用，<span style="color: #FF9500;">谢谢</span>。</span></span>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px; background: #F2F2F7; border-radius: 12px; padding: 10px 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#8E8E93" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 8a1.2 1.2 0 0 0-1.2 1.2v5.6a1.2 1.2 0 0 0 2.4 0v-5.6A1.2 1.2 0 0 0 12 10zm0-4.2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path></svg>
      <span style="font-size: 13px; line-height: 1.4; color: rgba(60,60,67,0.85);">Tonänderung: <span class="zh">不</span> bù wird vor einem 4. Ton zu bú.</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <span style="text-align: center; font-size: 13px; color: rgba(60,60,67,0.6);">Wie gut wusstest du es?</span>
  <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
    <div style="min-height: 64px; border-radius: 14px; background: rgba(255,59,48,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 15px; font-weight: 600; color: #D70015;">Nochmal</span>
      <span style="font-size: 12px; color: rgba(215,0,21,0.75);">&lt; 1 Min</span>
    </div>
    <div style="min-height: 64px; border-radius: 14px; background: rgba(255,149,0,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 15px; font-weight: 600; color: #C93400;">Schwer</span>
      <span style="font-size: 12px; color: rgba(201,52,0,0.75);">6 Min</span>
    </div>
    <div style="min-height: 64px; border-radius: 14px; background: rgba(52,199,89,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 15px; font-weight: 600; color: #248A3D;">Gut</span>
      <span style="font-size: 12px; color: rgba(36,138,61,0.8);">1 Tag</span>
    </div>
    <div style="min-height: 64px; border-radius: 14px; background: rgba(0,122,255,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 15px; font-weight: 600; color: #0040DD;">Einfach</span>
      <span style="font-size: 12px; color: rgba(0,64,221,0.75);">4 Tage</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
