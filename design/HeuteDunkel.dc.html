<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #000000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .zh { font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
    .rd { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; padding: 58px 16px 0 16px; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.2px; text-transform: uppercase; color: rgba(235,235,245,0.6);">Sonntag, 13. September</span>
      <span style="font-size: 34px; font-weight: 700; letter-spacing: 0.4px; line-height: 1.2;">Heute</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end;">
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #2C2C2E; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#8E8E93"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0z"></path></svg>
      </div>
    </div>
  </div>

  <div style="margin-top: 14px; background: #1C1C1E; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 18px;">
    <div style="position: relative; width: 96px; height: 96px; flex-shrink: 0;">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,159,10,0.25)" stroke-width="12"></circle>
        <circle cx="48" cy="48" r="40" fill="none" stroke="#FF9F0A" stroke-width="12" stroke-linecap="round" stroke-dasharray="100.5 251.3" transform="rotate(-90 48 48)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span class="rd" style="font-size: 26px; font-weight: 700; line-height: 1;">4</span>
        <span style="font-size: 11px; color: rgba(235,235,245,0.6);">von 10 Min</span>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; color: #FF9F0A;">Tagesziel</span>
        <span style="font-size: 15px; color: rgba(235,235,245,0.6);">Noch 6 Minuten</span>
      </div>
      <div style="height: 0.5px; background: rgba(84,84,88,0.65);"></div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FF9F0A"><path d="M12 2c1.2 3.4 6 6.2 6 11.5A6 6 0 0 1 6 13.5c0-2.4 1.2-4.2 2.4-5.4.6 2.4 1.8 3.6 3 3.6 0-3.6-1.2-6.5.6-9.7z"></path></svg>
        <span class="rd" style="font-size: 17px; font-weight: 700;">5</span>
        <span style="font-size: 15px;">Tage in Folge</span>
      </div>
    </div>
  </div>

  <div style="margin-top: 12px; background: #1C1C1E; border-radius: 12px; padding: 12px 16px 14px 16px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 6px; min-height: 22px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="13" rx="2.5"></rect><path d="M7 4h11a3 3 0 0 1 3 3v10"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #0A84FF;">Wiederholen</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 15px; color: rgba(235,235,245,0.6);">Jetzt fällig</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.3)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 4px;">
      <span class="rd" style="font-size: 32px; font-weight: 700; line-height: 1.1;">12</span>
      <span style="font-size: 17px; font-weight: 600; color: rgba(235,235,245,0.6);">Karten · ca. 4 Min</span>
    </div>
  </div>

  <div style="margin-top: 12px; background: #1C1C1E; border-radius: 12px; padding: 12px 16px 14px 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 6px; min-height: 22px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#30D158"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12zm0-9a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #30D158;">Weiter lernen</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 15px; color: rgba(235,235,245,0.6);">3 neue Sätze</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.3)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 22px; font-weight: 700;">Im 7-Eleven</span>
      <span class="zh" style="font-size: 17px; color: rgba(235,235,245,0.6);">超商</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; height: 6px; border-radius: 999px; background: rgba(120,120,128,0.36); overflow: hidden;">
        <div style="width: 62%; height: 100%; border-radius: 999px; background: #30D158;"></div>
      </div>
      <span style="font-size: 13px; color: rgba(235,235,245,0.6);">5 von 8</span>
    </div>
  </div>

  <div style="margin-top: 12px; background: #1C1C1E; border-radius: 12px; padding: 12px 16px 14px 16px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 6px; min-height: 22px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#5E5CE6"><path d="M4 3h13a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H10l-5 4v-4H4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #7D7AFF;">Rollenspiel</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 15px; color: rgba(235,235,245,0.6);">ca. 5 Min</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; font-weight: 700;">Batterien kaufen</span>
        <span style="font-size: 15px; color: rgba(235,235,245,0.6);">Sprich mit der Kassiererin</span>
      </div>
      <div style="min-height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(94,92,230,0.24); color: #7D7AFF; display: flex; align-items: center; font-size: 15px; font-weight: 600;">Starten</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 -16px; padding: 7px 0 34px 0; background: rgba(22,22,22,0.94); border-top: 0.5px solid rgba(255,255,255,0.15);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; color: #0A84FF;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">Heute</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; color: #8E8E93;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
      <span style="font-size: 10px; font-weight: 500;">Szenarien</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; color: #8E8E93;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M20 9a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2v2.5L17 19h-5"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">Rollenspiel</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; color: #8E8E93;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">Fortschritt</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
