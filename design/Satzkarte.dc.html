<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
  <style>
    body { margin: 0; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #007AFF; } a:hover { color: #0062CC; }
    .zh { font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; color: #000000; display: flex; flex-direction: column; padding: 54px 16px 34px 16px; overflow: hidden;">

  <div style="display: flex; align-items: center; min-height: 44px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center;">
      <div style="width: 30px; height: 30px; border-radius: 999px; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(60,60,67,0.6)" stroke-width="3.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;">
      <span style="font-size: 17px; font-weight: 600;">Im 7-Eleven</span>
      <span style="font-size: 13px; color: rgba(60,60,67,0.6);">Satz 5 von 8</span>
    </div>
    <div style="width: 44px;"></div>
  </div>

  <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px;">
    <div style="height: 4px; border-radius: 999px; background: #007AFF;"></div>
    <div style="height: 4px; border-radius: 999px; background: #007AFF;"></div>
    <div style="height: 4px; border-radius: 999px; background: #007AFF;"></div>
    <div style="height: 4px; border-radius: 999px; background: #007AFF;"></div>
    <div style="height: 4px; border-radius: 999px; background: #007AFF;"></div>
    <div style="height: 4px; border-radius: 999px; background: rgba(120,120,128,0.2);"></div>
    <div style="height: 4px; border-radius: 999px; background: rgba(120,120,128,0.2);"></div>
    <div style="height: 4px; border-radius: 999px; background: rgba(120,120,128,0.2);"></div>
  </div>

  <div style="margin-top: 18px; background: #FFFFFF; border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: rgba(60,60,67,0.6);">Das fragt die Kassiererin</span>

    <div style="display: flex; gap: 4px; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 50px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">xū</span>
        <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">需</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 50px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">yào</span>
        <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">要</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 50px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">dài</span>
        <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">袋</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 50px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">zi</span>
        <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">子</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 50px;">
        <span style="font-size: 15px; font-weight: 500; color: #007AFF;">ma</span>
        <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">嗎</span>
      </div>
      <span class="zh" style="font-size: 42px; font-weight: 600; line-height: 1.15;">？</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 13px; color: rgba(60,60,67,0.6);">Vereinfacht</span>
      <span class="zh" style="font-size: 20px;">需要袋子<span style="color: #FF9500;">吗</span>？</span>
    </div>

    <div style="height: 0.5px; background: rgba(60,60,67,0.29);"></div>
    <span style="font-size: 20px; font-weight: 600;">„Brauchen Sie eine Tüte?“</span>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="min-height: 50px; border-radius: 12px; background: rgba(0,122,255,0.12); color: #007AFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"></path><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        Anhören
      </div>
      <div style="min-height: 50px; border-radius: 12px; background: rgba(0,122,255,0.12); color: #007AFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <span style="font-size: 13px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 4px;">0,5×</span>
        Langsam
      </div>
    </div>
  </div>

  <div style="margin-top: 12px; background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; color: #C93400; background: rgba(255,149,0,0.15); border-radius: 6px; padding: 2px 6px;">TW</span>
      <span style="font-size: 15px; font-weight: 600;">Taiwan vs. Festland</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="zh" style="font-size: 20px; font-weight: 600;">塑膠袋</span>
        <span style="font-size: 13px; color: rgba(60,60,67,0.6);">sùjiāodài · Taiwan</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; opacity: 0.5;">
        <span class="zh" style="font-size: 20px; font-weight: 600;">塑料袋</span>
        <span style="font-size: 13px; color: rgba(60,60,67,0.6);">sùliàodài · Festland</span>
      </div>
    </div>
    <span style="font-size: 13px; color: rgba(60,60,67,0.6);">In Taiwan kosten Plastiktüten im Laden extra.</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="min-height: 52px; border-radius: 14px; background: #007AFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Weiter</div>
</div>
</x-dc>
</body>
</html>
