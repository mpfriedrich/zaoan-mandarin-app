<!doctype html>
<html>

</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; background: #f4f6f8; font-family: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif; }
    a { color: oklch(0.55 0.14 250); } a:hover { color: oklch(0.45 0.14 250); }
    .zh { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6f8; color: #111418; display: flex; flex-direction: column; padding: 64px 20px 0 20px; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 30px; font-weight: 700;">Heute</span>
    <div style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; background: #ffffff; border: 1px solid #dde2e8; border-radius: 12px; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.14 30)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.5 2 1.5 3 2.5 3 0-3-1-5.5.5-8.5z"></path></svg>

  </div>

  <div style="margin-top: 20px; background: #ffffff; border: 1px solid #dde2e8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 15px;">
      <span style="font-weight: 700;">Tagesziel</span>
      <span style="color: #5d6570;">4 von 10 Min</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px;">
      <div style="height: 10px; border-radius: 3px; background: #111418;"></div>
      <div style="height: 10px; border-radius: 3px; background: #111418;"></div>
      <div style="height: 10px; border-radius: 3px; background: #111418;"></div>
      <div style="height: 10px; border-radius: 3px; background: #111418;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
      <div style="height: 10px; border-radius: 3px; background: #dde2e8;"></div>
    </div>
  </div>

  <span style="margin-top: 26px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #5d6570;">Deine Strecke heute</span>

  <div style="margin-top: 14px; display: flex; flex-direction: column;">
    <div style="display: flex; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0;">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: oklch(0.55 0.14 250); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 14px; font-weight: 700;">1</div>
        <div style="width: 6px; flex-grow: 1; background: oklch(0.55 0.14 250);"></div>
      </div>
      <div style="flex-grow: 1; background: #ffffff; border: 2px solid oklch(0.55 0.14 250); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 700; color: oklch(0.5 0.14 250);">Jetzt</span>
          <span style="font-size: 19px; font-weight: 700;">12 Wiederholungen</span>
          <span style="font-size: 14px; color: #5d6570;">ca. 4 Minuten</span>
        </div>
        <div style="min-height: 48px; border-radius: 12px; background: oklch(0.55 0.14 250); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Starten</div>
      </div>
    </div>
    <div style="display: flex; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0;">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #ffffff; border: 6px solid oklch(0.55 0.14 150); box-sizing: border-box;"></div>
        <div style="width: 6px; flex-grow: 1; background: oklch(0.55 0.14 150);"></div>
      </div>
      <div style="flex-grow: 1; background: #ffffff; border: 1px solid #dde2e8; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; min-height: 44px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 700; color: oklch(0.45 0.14 150);">Neue Sätze</span>
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span style="font-size: 17px; font-weight: 700;">Im 7-Eleven</span>
            <span class="zh" style="font-size: 15px; color: #5d6570;">超商</span>
          </div>
          <span style="font-size: 14px; color: #5d6570;">3 neu · 5 von 8 gelernt</span>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0;">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #ffffff; border: 6px solid oklch(0.55 0.14 30); box-sizing: border-box;"></div>
      </div>
      <div style="flex-grow: 1; background: #ffffff; border: 1px solid #dde2e8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-height: 44px;">
        <span style="font-size: 13px; font-weight: 700; color: oklch(0.5 0.14 30);">Rollenspiel</span>
        <span style="font-size: 17px; font-weight: 700;">Batterien kaufen</span>
        <span style="font-size: 14px; color: #5d6570;">Du sprichst mit der Kassiererin</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #dde2e8; padding: 10px 0 30px 0; margin: 0 -20px; background: #ffffff;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: oklch(0.5 0.14 250);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 12px; font-weight: 700;">Heute</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #5d6570;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"></circle><circle cx="18" cy="18" r="2"></circle><path d="M8 6h6a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8h6"></path></svg>
      <span style="font-size: 12px;">Szenarien</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #5d6570;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      <span style="font-size: 12px;">Rollenspiel</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #5d6570;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 12px;">Mehr</span>
    </div>
  </div>
</div>
