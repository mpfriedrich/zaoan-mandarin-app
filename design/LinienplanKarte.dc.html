<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Noto+Sans+TC:wght@500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #f4f6f8; font-family: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif; }
    a { color: oklch(0.55 0.14 250); } a:hover { color: oklch(0.45 0.14 250); }
    .zh { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6f8; color: #111418; display: flex; flex-direction: column; padding: 60px 20px 34px 20px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #ffffff; border: 1px solid #dde2e8; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111418" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: oklch(0.55 0.14 150); color: #ffffff; font-size: 14px; font-weight: 700;">Im 7-Eleven</div>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 15px; color: #5d6570;">Satz 5 / 8</span>
  </div>

  <div style="margin-top: 22px; background: #ffffff; border: 1px solid #dde2e8; border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px;">
    <span style="font-size: 14px; color: #5d6570;">Das fragt die Kassiererin</span>

    <div style="display: flex; gap: 6px; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
        <span style="font-size: 15px; color: oklch(0.5 0.14 250);">xū</span>
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">需</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
        <span style="font-size: 15px; color: oklch(0.5 0.14 250);">yào</span>
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">要</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
        <span style="font-size: 15px; color: oklch(0.5 0.14 250);">dài</span>
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">袋</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
        <span style="font-size: 15px; color: oklch(0.5 0.14 250);">zi</span>
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">子</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
        <span style="font-size: 15px; color: oklch(0.5 0.14 250);">ma</span>
        <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1; color: oklch(0.5 0.14 30);">嗎</span>
      </div>
      <span class="zh" style="font-size: 44px; font-weight: 700; line-height: 1.1;">？</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #5d6570;">
      <span>vereinfacht:</span>
      <span class="zh" style="font-size: 20px; color: #111418;">需要袋子<span style="color: oklch(0.5 0.14 30);">吗</span>？</span>
    </div>

    <div style="height: 1px; background: #dde2e8;"></div>
    <span style="font-size: 20px; font-weight: 700;">„Brauchen Sie eine Tüte?“</span>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="min-height: 48px; border-radius: 12px; background: #111418; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"></path></svg>
        Anhören
      </div>
      <div style="min-height: 48px; border-radius: 12px; background: #ffffff; border: 1px solid #111418; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; box-sizing: border-box;">Langsam</div>
    </div>
  </div>

  <div style="margin-top: 14px; background: #ffffff; border: 1px solid #dde2e8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #5d6570;">Taiwan / Festland</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span class="zh" style="font-size: 20px; font-weight: 700;">塑膠袋</span>
        <span style="font-size: 14px; color: #5d6570;">sùjiāodài · Taiwan</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; opacity: 0.6;">
        <span class="zh" style="font-size: 20px; font-weight: 700;">塑料袋</span>
        <span style="font-size: 14px; color: #5d6570;">sùliàodài · Festland</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="min-height: 56px; border-radius: 14px; background: oklch(0.55 0.14 150); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">Weiter</div>
</div>
</x-dc>
</body>
</html>
